services:
  - type: web
    name: forge-performance-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: FORGE_ENVIRONMENT
        value: production
      - key: WAIT_FOR_DATABASE
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_COLLECTSTATIC
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FORGE_FRONTEND_ORIGIN
        sync: false
      - key: FORGE_PASSWORD_RECOVERY_ENABLED
        value: "false"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
