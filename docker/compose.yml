name: forge

services:
  db:
    image: postgres:18.4-alpine
    env_file:
      - ../backend/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - forge_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      WAIT_FOR_DATABASE: "true"
      RUN_MIGRATIONS: "true"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  forge_postgres_data:
