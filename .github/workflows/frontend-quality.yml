name: Frontend quality

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-quality.yml"
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-quality.yml"

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:frontend

      - name: Production build
        run: npm run build

  browser:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: forge-ci-only-7vQ2-mK9-pR4-xT8-zN6-wH3-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5175
      FORGE_FRONTEND_ORIGIN: http://127.0.0.1:5175
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_ci_only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_CONNECT_TIMEOUT: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements/dev.txt
          npx playwright install --with-deps chromium

      - name: Prepare browser-test data
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py create_dev_user --email teste@forge.local --password Teste-Forge-2026 --name "Pessoa Forge" --complete-onboarding
          python backend/manage.py seed_demo_plan --email teste@forge.local

      - name: Browser tests
        run: npm run test:e2e

      - name: Production PWA test
        run: npm run test:pwa

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
