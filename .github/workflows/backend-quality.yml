name: Backend quality

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend-quality.yml"
      - ".pre-commit-config.yaml"
  push:
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend-quality.yml"
      - ".pre-commit-config.yaml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: forge_test
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: forge-ci-only-7vQ2-mK9-pR4-xT8-zN6-wH3-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: https://forge-ci.example
      FORGE_FRONTEND_ORIGIN: https://forge-ci.example
      EMAIL_HOST: smtp.example.com
      EMAIL_HOST_USER: forge-ci
      EMAIL_HOST_PASSWORD: forge-ci-only
      DEFAULT_FROM_EMAIL: Forge CI <no-reply@forge-ci.example>
      POSTGRES_DB: forge_test
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_ci_only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_CONNECT_TIMEOUT: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Check migrations
        run: python manage.py makemigrations --check

      - name: Test with coverage
        run: |
          coverage run -m pytest
          coverage report
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Django checks
        run: |
          python manage.py check
          python manage.py check --deploy --settings=config.settings.production

      - name: Build backend image
        working-directory: .
        run: docker build --file backend/Dockerfile backend
